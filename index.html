<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play the game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="intro">
        <h1>Welcome To The World End Game</h1>
        <label for="txt">Enter the user name: </label>
        <input type="text" name="txt" id="txt" width="32px">
        <h3>The rules of the game is the one to score 5 points first is the winner</h3>
    </div>
    
    <div class="roundCt">
        <button class="play">PLAY</button>
        <p> </p>
    </div>
    
    <div class="points">
        <div class="user">
        </div>
        <div class="comp">
        </div>
    </div>

    <div class="pics">
        <div class="rock">
            <img src="rock.png" alt="rock">
        </div>
        <div class="paper">
            <img src="paper.png" alt="paper">
        </div>
        <div class="sci">
            <img src="scisoors.png" alt="scissors">
        </div>
    </div>

    <div class="final_statement">
        <!-- // the final msg of who won and want to play again button! -->
        
    </div>

    <script src="javascript.js"></script>
</body>
</html>
